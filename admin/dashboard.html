<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-100">
    <div class="min-h-screen flex">
        <!-- Sidebar -->
        <div class="w-64 bg-gray-800 text-white p-4">
            <h2 class="text-2xl font-bold mb-6">Admin</h2>
            <nav>
                <a href="#" class="block py-2 px-4 rounded hover:bg-gray-700">Dashboard</a>
                <a href="#" class="block py-2 px-4 rounded hover:bg-gray-700">Products</a>
                <a href="#" id="logout-btn" class="block py-2 px-4 rounded hover:bg-gray-700">Logout</a>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="flex-1 p-8">
            <h1 class="text-3xl font-bold mb-8">Products</h1>
            <button id="add-product-btn" class="bg-green-500 text-white py-2 px-4 rounded hover:bg-green-600 mb-4">
                <i class="fas fa-plus"></i> Add Product
            </button>
            <div id="product-list" class="bg-white p-4 rounded-lg shadow-md">
                <!-- Product list will be rendered here -->
            </div>
        </div>
    </div>

    <!-- Add/Edit Product Modal -->
    <div id="product-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3 text-center">
                <h3 class="text-lg leading-6 font-medium text-gray-900" id="modal-title">Add Product</h3>
                <form id="product-form" class="mt-2">
                    <input type="hidden" id="product-id">
                    <div class="mb-4">
                        <label for="product-name" class="block text-gray-700">Name</label>
                        <input type="text" id="product-name" class="w-full px-3 py-2 border rounded-lg" required>
                    </div>
                    <div class="mb-4">
                        <label for="product-price" class="block text-gray-700">Price</label>
                        <input type="number" id="product-price" class="w-full px-3 py-2 border rounded-lg" required>
                    </div>
                    <div class="mb-4">
                        <label for="product-description" class="block text-gray-700">Description</label>
                        <textarea id="product-description" class="w-full px-3 py-2 border rounded-lg" required></textarea>
                    </div>
                    <div class="mb-4">
                        <label for="product-image" class="block text-gray-700">Image</label>
                        <input type="file" id="product-image" class="w-full">
                    </div>
                    <div class="items-center px-4 py-3">
                        <button id="save-product-btn" class="px-4 py-2 bg-green-500 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-300">
                            Save
                        </button>
                    </div>
                </form>
                <button id="close-modal-btn" class="absolute top-0 right-0 mt-4 mr-4 text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="../src/admin/dashboard.js" type="module"></script>
</body>
</html>
